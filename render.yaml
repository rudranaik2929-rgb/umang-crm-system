services:
  - type: web
    name: umang-crm-backend
    runtime: docker
    rootDir: backend
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        value: "https://umanghometechllp.in,https://www.umanghometechllp.in"
      - key: FRONTEND_URL
        value: "https://umanghometechllp.in"
      - key: FACEBOOK_VERIFY_TOKEN
        value: UMANGCRM123
      - key: FACEBOOK_PAGE_ACCESS_TOKEN
        sync: false
      - key: FACEBOOK_PAGE_ID
        sync: false
      - key: HOUSING_PROFILE_ID
        value: "2548773"
      - key: HOUSING_ENCRYPTION_KEY
        sync: false
      - key: HOUSING_INTEGRATION_UUID
        sync: false
      - key: HOUSING_WEBHOOK_SECRET
        sync: false
      - key: HOUSING_AUTO_SYNC_ENABLED
        value: "true"
      - key: HOUSING_AUTO_SYNC_INTERVAL_SEC
        value: "300"
      - key: LEADS_CACHE_TTL_SEC
        value: "300"
      - key: STATS_CACHE_TTL_SEC
        value: "120"
